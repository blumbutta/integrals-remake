name: Publish Integrals Remake
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test
      - run: npm run check
      - name: Package public game only
        run: |
          mkdir -p public/shared public/assets
          cp index.html style.css layout-refresh.css world-events.css app.mjs music.mjs format.mjs effects.mjs world.mjs research-art.mjs resource-info.mjs research-info.mjs research-tooltip.mjs cloud-connection.mjs achievement-art.mjs prestige-audio.mjs public/
          cp shared/*.mjs public/shared/
          cp -R assets/. public/assets/
          node server/version-public.mjs public
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
